apiVersion: apps/v1
kind: Deployment
metadata:
  name: msp-homepage
  namespace: www
  labels: { app: msp-homepage }
spec:
  replicas: 1
  selector: { matchLabels: { app: msp-homepage } }
  template:
    metadata: { labels: { app: msp-homepage } }
    spec:
      containers:
        - name: web
          image: yny.ocir.io/axbeonwnkylm/chuncheon-prod/msp-homepage:981066b
          ports: [{ containerPort: 3000 }]
          env:
            # msp-homepage-secrets는 이 (퍼블릭) 레포 밖에서 클러스터에 직접
            # 생성한다 - Slack Incoming Webhook URL을 git에 커밋하지 않기 위함.
            # optional: true라 시크릿이 아직 없어도 파드는 정상 기동하고,
            # 문의 폼만 500을 반환한다 (app/api/contact/route.ts 참고).
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: msp-homepage-secrets
                  key: slack-webhook-url
                  optional: true
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
